name: Daily VCP Auto Scanner

on:
  schedule:
    # UTC 8:00 等於台灣時間下午 16:00 (每週一到週五執行)
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # 允許手動點擊按鈕觸發

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests urllib3

      - name: Run Data Scraper
        run: python fetch_vcp.py

      - name: Commit and Push new CSV
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add vcp_*.csv
          git commit -m "Auto-update VCP data [skip ci]" || echo "No changes to commit"
          git push
